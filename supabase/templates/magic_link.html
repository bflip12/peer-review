<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to Peer Review</title>
  </head>
  <body style="margin: 0; padding: 0; background: #f2f0eb">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #f2f0eb">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 480px;
              font-family:
                &quot;IBM Plex Mono&quot;, &quot;Courier New&quot;, Courier, monospace;
              color: #191816;
              font-size: 15px;
              line-height: 1.6;
            ">
            <tr>
              <td
                style="
                  padding-bottom: 16px;
                  border-bottom: 1px solid #191816;
                  font-size: 17px;
                  font-weight: 500;
                ">
                PeerReview<span style="font-size: 13px; font-weight: 400">.club</span>
              </td>
            </tr>
            <tr>
              <td style="padding-top: 32px">
                <h1
                  style="
                    margin: 0 0 16px;
                    font-size: 22px;
                    font-weight: 400;
                    line-height: 1.25;
                  ">
                  Sign in to Peer Review
                </h1>
                <p style="margin: 0 0 24px">
                  Press the button to sign in. The link works once.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="background: #191816">
                      <a
                        href="{{ .RedirectTo }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
                        style="
                          display: inline-block;
                          padding: 12px 24px;
                          color: #f2f0eb;
                          font-weight: 500;
                          text-decoration: none;
                        ">
                        Sign in
                      </a>
                    </td>
                  </tr>
                </table>
                <p style="margin: 32px 0 8px; color: #5d5a54; font-size: 13px">
                  If the button does not work, copy this link into your browser:
                </p>
                <!-- prettier-ignore -->
                <p style="margin: 0; color: #5d5a54; font-size: 13px; word-break: break-all">{{ .RedirectTo }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email</p>
                <p
                  style="
                    margin: 32px 0 0;
                    padding-top: 16px;
                    border-top: 1px solid #d3cfc6;
                    color: #5d5a54;
                    font-size: 13px;
                  ">
                  If you did not ask to sign in, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
