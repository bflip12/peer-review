# Applies new migrations to the hosted Supabase project after they merge to main, then
# runs the schema guard tests against it. Migrations are never applied by hand.
# Vercel deploys the app at the same time, so every migration must work with the app
# that is live (.claude/rules/supabase.md).
name: Migrate

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migrate.yml"
  workflow_dispatch:

# One run at a time, and a run in progress is never cancelled halfway through.
concurrency:
  group: migrate-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: stcjavdqwjgdgudoudqv
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  migrate:
    name: Apply migrations to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Link the hosted project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: List the migrations that will run
        run: npx supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        run: npx supabase db push --linked --yes --password "$SUPABASE_DB_PASSWORD"

      # Postgres version, RLS on every table, and only listed functions callable.
      - name: Check the hosted schema
        run: npx vitest run --config vitest.db.config.mts supabase/tests/schema.test.ts
        env:
          SUPABASE_QUERY_FLAG: --linked
